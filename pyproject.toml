[project]
name = "kb-recall"
version = "0.2.1"
description = "MCP server that gives Claude Code and GitHub Copilot persistent, feature-scoped knowledge across sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    # Name only — no email. PyPI metadata is public and permanent, and support
    # runs through the GitHub issue tracker (listed in [project.urls] below).
    { name = "nguyenquangsang" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude-code",
    "github-copilot",
    "ai",
    "memory",
    "knowledge-base",
]
classifiers = [
    # No "License :: OSI Approved :: MIT License" classifier: `license` above is a
    # PEP 639 SPDX expression, which supersedes the classifier form — listing both
    # is redundant at best, and rejected by tooling that cross-validates them at worst.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    # Upper bound is load-bearing, not cosmetic: server.py uses the v2 API
    # (`mcp.server.mcpserver.MCPServer`, renamed from FastMCP in 2.0). We pin a
    # known-good 2.2.x minor — an install that resolves without this lock file
    # could get a future 2.3+/3.x and break at import the same way 1.x→2.x did —
    # `uv.lock` hides that locally on every dev machine.
    "mcp[cli]>=2.2.0,<2.3.0",
]

[project.urls]
Homepage = "https://github.com/nguyenquangsang/kb-recall"
Repository = "https://github.com/nguyenquangsang/kb-recall"
Issues = "https://github.com/nguyenquangsang/kb-recall/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb_recall"]

[tool.hatch.build.targets.sdist]
# Demo recordings are docs assets, not package data — nothing under `kb_recall/`
# reads them, and the wheel above never included them. README references them by
# absolute raw.githubusercontent.com URL (PyPI does not resolve repo-relative
# paths), so the PyPI page renders without them. Left in, they were 76% of the
# sdist; excluded, the tarball drops from ~6.4 MB to ~0.66 MB and the GIFs can
# stay at full quality instead of being compressed for a download almost nobody
# makes — `pip install` resolves to the wheel.
exclude = ["/images"]

[project.scripts]
recall = "kb_recall.cli:main"
recall-server = "kb_recall.server:main"
# GitHub Copilot hook entry point. A console script rather than
# `python -m kb_recall.adapters.copilot.hook` because the harness spawns hook
# commands through a shell that never sources the user's rc: `uv run` would add
# ~1s per tool call (this hook fires per tool call, not per turn) and a bare
# interpreter name may not resolve at all.
recall-copilot-hook = "kb_recall.adapters.copilot.hook:main"

[dependency-groups]
dev = ["mypy>=2.1.0", "pytest>=8.0.0", "ruff>=0.15.18"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Matches the floor in `requires-python` — keeps version-gated lint rules from
# suggesting syntax that would break the oldest supported interpreter.
target-version = "py310"

[tool.ruff.lint]
# Rules are pinned explicitly rather than left to ruff's defaults. CI runs
# whatever `uv.lock` resolves, and ruff has widened its default rule set between
# minor releases, so an unpinned select turns a routine `uv lock --upgrade` into
# a red CI run with no code change to explain it.
select = [
    "E4", "E7", "E9",  # pycodestyle errors (no E501 — the codebase is not wrapped at 88)
    "F",               # pyflakes
    "I",               # isort
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
    "BLE",             # flake8-blind-except
    "S110", "S112",    # try-except-pass / continue
    "DTZ",             # flake8-datetimez
    "FLY",             # flynt (f-string conversion)
    "ISC",             # implicit string concatenation
    "EXE",             # shebang / executable-bit mismatches
    "PLR1722",         # sys.exit over exit
    "PLW1510",         # subprocess.run without an explicit check=
]
# Typographic dashes and quotes are deliberate in the user-facing KB prose these
# modules embed (em dashes, curly quotes) — normalizing them would change what
# users read in their own README sections.
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The hook entry points execute inside the agent harness. A traceback there ends
# the user's session, so every handler deliberately swallows Exception and
# degrades quietly — BLE001/S110/S112 are the contract here, not an oversight.
"kb_recall/hooks/*.py" = ["BLE001", "S110", "S112"]
"kb_recall/adapters/copilot/*.py" = ["BLE001", "S110", "S112"]
